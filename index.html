<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <!-- Logo/Header -->
            <div class="header">
                <h1 id="app-name">MyApp</h1>
                <p id="tagline">Welcome back</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab(0)" id="signin-tab">Sign In</button>
                <button class="tab-button" onclick="switchTab(1)" id="signup-tab">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="form active" onsubmit="handleSubmit(event, 'signin')">
                <div class="input-group">
                    <label for="signin-email">Email or Username</label>
                    <input type="text" id="signin-email" placeholder="Enter your email or username" required>
                </div>
                <div class="input-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="Enter your password" required>
                </div>
                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember-me"> Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
                <button type="submit" class="submit-btn" id="signin-btn">Sign In</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="form" onsubmit="handleSubmit(event, 'signup')">
                <div class="input-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="submit-btn" id="signup-btn">Create Account</button>
            </form>

            <!-- Footer Links -->
            <div class="footer-links">
                <p>By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <p>Or continue with</p>
                <div class="social-buttons">
                    <button class="social-btn">Google</button>
                    <button class="social-btn">Apple</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
